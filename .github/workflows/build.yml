# xm-k5-firmware CI - single fixed-target build (Makefile hard-coded block)
# Base workflow from uv-k5-firmware-custom (LOSEHU), adapted for XM builds.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syyu --noconfirm \
            base-devel \
            arm-none-eabi-gcc \
            arm-none-eabi-newlib \
            git \
            python-pip \
            python-crcmod

      - name: Checkout
        uses: actions/checkout@v4

      - name: safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build (fixed XM target)
        run: make build

      - name: Size report (60KB flash limit)
        run: |
          arm-none-eabi-size firmware
          TEXT=$(arm-none-eabi-size firmware | awk 'NR==2{print $1}')
          DATA=$(arm-none-eabi-size firmware | awk 'NR==2{print $2}')
          FLASHUSE=$((TEXT + DATA))
          echo "Flash usage: ${FLASHUSE} / 61440 bytes"
          awk "BEGIN{printf \"Flash usage: %.1f%% of 60KB\\n\", ${FLASHUSE}*100/61440}"
          echo "flashuse=$FLASHUSE" >> "$GITHUB_OUTPUT"
        id: size

      - name: Enforce 60KB red line
        run: |
          FLASHUSE=${{ steps.size.outputs.flashuse }}
          if [ "$FLASHUSE" -gt 61440 ]; then
            echo "::error::Firmware exceeds 60KB red line (${FLASHUSE} bytes, over by $((FLASHUSE - 61440)))"
            echo '--- top symbols (for trimming) ---'
            arm-none-eabi-nm --size-sort firmware | tail -25
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xm-firmware
          path: |
            XM*.bin
            firmware.bin
